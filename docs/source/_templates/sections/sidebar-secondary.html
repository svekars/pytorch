{# sidebar-secondary.html #}
{% if secondary_sidebar_items -%}
<div class="sidebar-secondary-items sidebar-secondary__inner">
{% for toc_item in secondary_sidebar_items %}
  <div class="sidebar-secondary-item">{% include toc_item %}</div>
{% endfor %}
</div>
<div class="sidebar-secondary-item">
 <h6>PyTorch Libraries</h6>
 <ul>
 {% for link in external_links %}
  <li><a class="nav-link nav-external" href="{{ link.url }}">{{ link.name }}</a></li>
 {% endfor %}
 </ul>
</div>
</div>
{% endif %}
